<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测测你是哪种「常熟阿诺」？</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #ff2d2d;
      --bg: #000;
      --card: #0d0d0d;
      --border: #2a2a2a;
      --text: #fff;
      --muted: #888;
      --dim: #444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 60px;
    }
    .container { width: 100%; max-width: 480px; padding: 0 16px; }
    .page { display: none; opacity: 0; transform: translateY(24px); transition: opacity 0.35s ease, transform 0.35s ease; }
    .page.active { display: block; }
    .page.visible { opacity: 1; transform: translateY(0); }

    /* WELCOME */
    .welcome-hero { padding-top: 48px; margin-bottom: 28px; text-align: center; }
    .hero-icon { width: 72px; height: 72px; margin: 0 auto 24px; }
    .welcome-eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 14px; }
    .welcome-title { font-size: 34px; font-weight: 900; line-height: 1.2; margin-bottom: 14px; }
    .welcome-title em { font-style: normal; color: var(--red); }
    .welcome-sub { font-size: 14px; color: var(--muted); line-height: 1.75; }
    .welcome-stats { display: flex; justify-content: space-around; margin: 28px 0; padding: 20px 16px; border: 1px solid var(--border); background: var(--card); }
    .stat-item { text-align: center; }
    .stat-num { font-size: 26px; font-weight: 900; color: var(--red); display: block; line-height: 1; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; }
    .welcome-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; justify-content: center; }
    .tag { border: 1px solid var(--border); padding: 5px 12px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    /* BUTTONS */
    .btn { display: block; width: 100%; padding: 18px 16px; background: var(--bg); color: var(--text); border: 2px solid var(--text); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; text-align: center; transition: background 0.15s, color 0.15s, transform 0.1s; letter-spacing: 2px; }
    .btn:hover { background: var(--text); color: var(--bg); }
    .btn:active { transform: scale(0.98); }
    .btn-red { border-color: var(--red); color: var(--red); }
    .btn-red:hover { background: var(--red); color: var(--bg); }

    /* QUIZ */
    .quiz-header { padding-top: 36px; margin-bottom: 20px; }
    .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-label-txt { font-size: 10px; color: var(--muted); letter-spacing: 3px; }
    .progress-pct { font-size: 13px; font-weight: 700; color: var(--red); }
    .progress-bar-bg { width: 100%; height: 5px; background: #1a1a1a; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--red); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .question-card { background: var(--card); border: 1px solid var(--border); padding: 26px 22px; margin-bottom: 14px; }
    .question-num { font-size: 10px; color: var(--dim); letter-spacing: 3px; margin-bottom: 10px; }
    .question-text { font-size: 21px; font-weight: 800; line-height: 1.45; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 15px 16px; background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 14px; font-family: inherit; cursor: pointer; text-align: left; transition: border-color 0.15s, background 0.15s; line-height: 1.5; }
    .opt-btn:hover:not(.disabled) { border-color: #555; }
    .opt-btn.selected { border-color: var(--red); background: #130000; }
    .opt-btn.disabled { cursor: not-allowed; }
    .opt-badge { min-width: 22px; height: 22px; border: 1.5px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--red); flex-shrink: 0; margin-top: 1px; transition: background 0.15s, color 0.15s; }
    .opt-btn.selected .opt-badge { background: var(--red); color: #000; }
    .opt-text { flex: 1; }

    /* RESULT */
    .result-page { padding-top: 36px; }
    .result-eyebrow { font-size: 10px; color: var(--red); letter-spacing: 4px; margin-bottom: 6px; }
    .persona-img-outer { margin: 20px auto 24px; text-align: center; }
    .persona-img-wrap { width: 180px; height: 216px; margin: 0 auto; border: 2px solid var(--border); overflow: hidden; background: #080808; display: block; position: relative; }
    .persona-img-wrap::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 36px; background: linear-gradient(to top, #080808, transparent); pointer-events: none; }
    .persona-img-wrap svg { width: 100%; height: 100%; display: block; }
    .persona-type-row { text-align: center; margin-top: 10px; }
    .type-badge { display: inline-block; border: 1px solid var(--red); color: var(--red); font-size: 10px; padding: 3px 12px; letter-spacing: 2px; }
    .result-name { font-size: 40px; font-weight: 900; margin: 14px 0 10px; line-height: 1.05; text-align: center; }
    .result-quote { font-size: 14px; color: var(--red); margin-bottom: 18px; padding: 12px 16px; border-left: 3px solid var(--red); background: #0d0000; line-height: 1.6; }
    .result-desc { font-size: 14px; color: #bbb; line-height: 1.9; margin-bottom: 28px; }
    .section-label { font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-bottom: 16px; }
    .radar-wrap { width: 200px; height: 200px; margin: 0 auto 28px; }
    .score-bars { margin-bottom: 28px; }
    .score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .score-dim { font-size: 12px; color: var(--muted); width: 36px; flex-shrink: 0; }
    .score-bar-bg { flex: 1; height: 3px; background: #1a1a1a; }
    .score-bar-fill { height: 3px; background: var(--red); transition: width 0.9s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .score-val { font-size: 12px; color: var(--dim); width: 24px; text-align: right; flex-shrink: 0; }
    .divider { border: none; border-top: 1px solid #1a1a1a; margin: 24px 0; }
    .share-card { border: 1px solid var(--border); padding: 22px 20px; margin-bottom: 14px; background: var(--card); position: relative; }
    .share-card-label { position: absolute; top: -8px; left: 14px; background: var(--card); padding: 0 8px; font-size: 10px; color: var(--muted); letter-spacing: 2px; }
    .share-main { font-size: 15px; font-weight: 700; line-height: 1.7; margin-bottom: 8px; }
    .share-main strong { color: var(--red); }
    .share-quote-text { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 14px; }
    .share-slogan { font-size: 12px; color: var(--dim); border-top: 1px solid #1a1a1a; padding-top: 12px; letter-spacing: 1px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .nuo-level { display: inline-block; background: var(--red); color: #000; font-size: 12px; padding: 4px 14px; font-weight: 900; letter-spacing: 3px; }
    .result-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
    .result-tag { border: 1px solid #2a2a2a; padding: 4px 10px; font-size: 11px; color: #888; }
  </style>
</head>
<body>
<div class="container">

  <section id="welcome" class="page">
    <div class="welcome-hero">
      <div class="hero-icon">
        <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <rect width="72" height="72" fill="#000"/>

        </svg>
      </div>
      <p class="welcome-eyebrow">What can i say</p>
      <h1 class="welcome-title">来测测你的<br><em>阿诺浓度</em></h1>
      <p class="welcome-sub">25 道题，测出你的阿诺人格<br>暴躁？诺化？还是废柴？不服来辩！</p>
    </div>
    <div class="welcome-stats">
      <div class="stat-item"><span class="stat-num" id="user-count">--</span><span class="stat-label">人已测试</span></div>
      <div class="stat-item"><span class="stat-num">16</span><span class="stat-label">种人格</span></div>
      <div class="stat-item"><span class="stat-num">25</span><span class="stat-label">道题目</span></div>
    </div>
    <div class="welcome-tags">
      <span class="tag">不服就干</span><span class="tag">细狗鉴定</span>
      <span class="tag">氮泵起飞</span><span class="tag">头尖哲学</span>
    </div>
    <button class="btn btn-red" onclick="startQuiz()">开始测试 →</button>
  </section>

  <section id="quiz" class="page">
    <div class="quiz-header">
      <div class="progress-meta">
        <span class="progress-label-txt">诺化进度</span>
        <span class="progress-pct" id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>
    <div class="question-card">
      <p class="question-num" id="q-num">Q01 / 25</p>
      <p class="question-text" id="q-text"></p>
    </div>
    <div class="options" id="q-opts"></div>
  </section>

  <section id="result" class="page result-page">
    <p class="result-eyebrow">▶ 测试结果</p>
    <div class="persona-img-outer">
      <div class="persona-img-wrap" id="persona-img"></div>
      <div class="persona-type-row"><span class="nuo-level" id="res-nuo-level"></span></div>
    </div>
    <h2 class="result-name" id="res-name"></h2>
    <p class="result-quote" id="res-quote"></p>
    <p class="result-desc" id="res-desc"></p>
    <div class="result-tags" id="res-tags"></div>
    <p class="section-label">— 三维评估 —</p>
    <div class="radar-wrap" id="radar-wrap"></div>
    <div class="score-bars">
      <div class="score-row"><span class="score-dim">暴躁</span><div class="score-bar-bg"><div class="score-bar-fill" id="bar-0"></div></div><span class="score-val" id="val-0"></span></div>
      <div class="score-row"><span class="score-dim">诺化</span><div class="score-bar-bg"><div class="score-bar-fill" id="bar-1"></div></div><span class="score-val" id="val-1"></span></div>
      <div class="score-row"><span class="score-dim">废柴</span><div class="score-bar-bg"><div class="score-bar-fill" id="bar-2"></div></div><span class="score-val" id="val-2"></span></div>
    </div>
    <hr class="divider">
    <div class="share-card">
      <span class="share-card-label">分享给细狗们</span>
      <div class="share-main" id="share-main"></div>
      <div class="share-quote-text" id="share-quote-text"></div>
      <p class="share-slogan">不服来辩！细狗！</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-red" id="copy-btn" onclick="shareResult()">分享测试结果</button>
      <button class="btn" onclick="restartQuiz()">再测一次</button>
    </div>
  </section>

</div>

/* ===== STATE ===== */
let scores = [0,0,0], current = 0, currentResult = null;

/* ===== PAGE ===== */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active','visible'));
  const el = document.getElementById(id);
  el.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
  window.scrollTo(0,0);
}

/* ===== QUIZ ===== */
function startQuiz() {
  scores=[0,0,0]; current=0;
  showPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const pct = Math.round(current/questions.length*100);
  document.getElementById('q-num').textContent = 'Q' + String(current+1).padStart(2,'0') + ' / ' + questions.length;
  document.getElementById('q-text').textContent = q.title;
  document.getElementById('progress-pct').textContent = '诺化进度 ' + pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  const labels = ['A','B','C'];
  const optsEl = document.getElementById('q-opts');
  optsEl.innerHTML = '';
  q.options.forEach((opt,i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = '<span class="opt-badge">' + labels[i] + '</span><span class="opt-text">' + opt.text + '</span>';
    btn.onclick = () => selectOpt(i, btn);
    optsEl.appendChild(btn);
  });
}

function selectOpt(idx, btn) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
  btn.classList.add('selected');
  const s = questions[current].options[idx].score;
  scores[0]+=s[0]; scores[1]+=s[1]; scores[2]+=s[2];
  setTimeout(() => { current++; current < questions.length ? renderQuestion() : showResult(); }, 420);
}

/* ===== RESULT ===== */
function getResult() {
  const max = Math.max(...scores);
  const maxIdx = scores.indexOf(max);
  const group = results.filter(r => r.scoreType === maxIdx);
  const pick = (scores[0]*7 + scores[1]*11 + scores[2]*13) % group.length;
  return group[pick] || group[0];
}

function drawRadar(sc) {
  const max = Math.max(...sc, 1);
  const norm = sc.map(s => Math.max(s/max, 0.08));
  const cx=100, cy=108, r=72;
  const angs = [-90,150,30].map(d => d*Math.PI/180);
  const pts = angs.map((a,i) => [cx+r*norm[i]*Math.cos(a), cy+r*norm[i]*Math.sin(a)]);
  const outer = angs.map(a => [cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  const ptStr = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const grids = [0.33,0.66,1].map(s => {
    const gp = angs.map(a => [cx+r*s*Math.cos(a), cy+r*s*Math.sin(a)]);
    return '<polygon points="'+gp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#222" stroke-width="1"/>';
  }).join('');
  const axes = outer.map(p => '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#2a2a2a" stroke-width="1"/>').join('');
  const dots = pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="#ff2d2d"/>').join('');
  const labs = [
    {x:outer[0][0],   y:outer[0][1]-13, t:'暴躁', a:'middle'},
    {x:outer[1][0]-12,y:outer[1][1]+10, t:'诺化', a:'end'},
    {x:outer[2][0]+12,y:outer[2][1]+10, t:'废柴', a:'start'}
  ].map(l => '<text x="'+l.x.toFixed(1)+'" y="'+l.y.toFixed(1)+'" fill="#999" font-size="12" font-family="system-ui" text-anchor="'+l.a+'">'+l.t+'</text>').join('');
  document.getElementById('radar-wrap').innerHTML =
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" fill="#080808"/>' +
    grids+axes+'<polygon points="'+ptStr+'" fill="#ff2d2d" fill-opacity="0.2" stroke="#ff2d2d" stroke-width="2"/>'+dots+labs+
    '<circle cx="'+cx+'" cy="'+cy+'" r="2" fill="#333"/></svg>';
}

function showResult() {
  const p = getResult();
  currentResult = p;
  const svgKey = svgKeyMap[p.type] || '肌肉失忆者';
  document.getElementById('persona-img').innerHTML = svgs[svgKey] || svgs['肌肉失忆者'];
  document.getElementById('res-nuo-level').textContent = p.nuohuaLevel;
  document.getElementById('res-name').textContent = p.type;
  document.getElementById('res-quote').textContent = '「' + p.quote + '」';
  document.getElementById('res-desc').textContent = p.desc;
  const tagsEl = document.getElementById('res-tags');
  tagsEl.innerHTML = p.tag.map(t => '<span class="result-tag">' + t + '</span>').join('');
  document.getElementById('share-main').innerHTML = '我测出来是「常熟阿诺之<strong>【' + p.type + '】</strong>」';
  document.getElementById('share-quote-text').textContent = '"' + p.quote + '"';
  document.getElementById('copy-btn').textContent = '分享测试结果';
  drawRadar(scores);
  showPage('result');
  const maxScore = Math.max(...scores,1);
  setTimeout(() => {
    [0,1,2].forEach(i => {
      document.getElementById('bar-'+i).style.width = Math.round(scores[i]/maxScore*100)+'%';
      document.getElementById('val-'+i).textContent = scores[i];
    });
  }, 350);
}

function shareResult() {
  const p = currentResult || getResult();
  const url = window.location.href.split('#')[0];
  const text = '我测出来是「常熟阿诺之【' + p.type + '】」\n"' + p.quote + '"\n不服来辩！细狗！\n\n来测测你的阿诺浓度👇';
  const btn = document.getElementById('copy-btn');
  if (navigator.share) {
    navigator.share({ title: '来测测你的阿诺浓度', text: text, url: url })
      .catch(() => {});
  } else {
    navigator.clipboard.writeText(text + '\n' + url).then(() => {
      btn.textContent = '✓ 已复制！';
      setTimeout(() => { btn.textContent = '分享测试结果'; }, 2200);
    }).catch(() => {
      prompt('复制以下内容发送给好友：', text + '\n' + url);
    });
  }
}

function restartQuiz() { startQuiz(); }

/* ===== INIT ===== */
document.getElementById('user-count').textContent = (38000+Math.floor(Math.random()*58000)).toLocaleString();
showPage('welcome');
</script>
